[versions]
# Runtime
paper = "1.12-R0.1-SNAPSHOT"
gson = "2.2.4"
snakeyaml = "1.26"

# Plugins
askyblock = "3.0.9.4"
factionsone = "1.2.2"
griefprevention = "11.5.2"
mapmanager = "1.7.2-SNAPSHOT"
massive-core = "7.0.1"
massive-factions = "2.7.5"
p2 = "3.809.1-SNAPSHOT"
papi = "2.11.6"
plotme = "0.16.3"
protocollib = "4.4.0"
regios = "5.9.9"
residence = "4.5._13.1"
towny = "0.84.0.9"
vault = "1.7"
voxelsniper = "5.171.0"
worldedit = "6.1.3-SNAPSHOT"
worldguard = "6.0.0-SNAPSHOT"

# Third-party
blockshub = "2.0"
fastutil-lite = "1.0"
redprotect = "1.9.6"
zstd-jni = "1.1.1"

# Gradle
blossom = "2.2.0"        # https://github.com/KyoriPowered/blossom/releases
ideaExt = "1.3"          # https://github.com/jetbrains/gradle-idea-ext-plugin
publish = "0.34.0"       # https://github.com/vanniktech/gradle-maven-publish-plugin/releases
shadow = "9.2.2"         # https://github.com/GradleUp/shadow/releases

[libraries]
# Runtime
paperApi = { group = "com.destroystokyo.paper", name = "paper-api", version.ref = "paper" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }

# Plugins
askyblock = { group = "com.wasteofplastic", name = "askyblock", version.ref = "askyblock" }
factionsone = { group = "com.factionsone", name = "FactionsOne", version.ref = "factionsone" }
griefprevention = { group = "me.ryanhamshire", name = "GriefPrevention", version.ref = "griefprevention" }
mapmanager = { group = "org.inventivetalent", name = "mapmanager", version.ref = "mapmanager" }
massiveCore = { group = "com.massivecraft", name = "mcore", version.ref = "massive-core" }
massiveFactions = { group = "com.massivecraft.factions", name = "factions", version.ref = "massive-factions" }
p2Core = { group = "co.crystaldev", name = "plotsquared-core", version.ref = "p2" }
papi = { group = "me.clip", name = "placeholderapi", version.ref = "papi" }
plotmeCore = { group = "com.worldcretornica", name = "plotme_core", version.ref = "plotme" }
protocollib = { group = "com.comphenix.protocol", name = "ProtocolLib-API", version.ref = "protocollib" }
regios = { group = "net.jzx7", name = "regios", version.ref = "regios" }
residence = { group = "com.bekvon.bukkit.residence", name = "Residence", version.ref = "residence" }
towny = { group = "com.palmergames.bukkit", name = "towny", version.ref = "towny" }
vault = { group = "com.github.MilkBowl", name = "VaultAPI", version.ref = "vault" }
voxelsniper = { group = "com.thevoxelbox.voxelsniper", name = "voxelsniper", version.ref = "voxelsniper" }
worldeditBukkit = { group = "com.sk89q.worldedit", name = "worldedit-bukkit", version.ref = "worldedit" }
worldeditCore = { group = "com.sk89q.worldedit", name = "worldedit-core", version.ref = "worldedit" }
worldguard = { group = "com.sk89q", name = "worldguard", version.ref = "worldguard" }

# Third-party
blockshub = { group = "org.primesoft", name = "BlocksHub", version.ref = "blockshub" }
fastutilLite = { group = "co.aikar", name = "fastutil-lite", version.ref = "fastutil-lite" }
redprotect = { group = "net.fabiozumbi12", name = "redprotect", version.ref = "redprotect" }
zstdJni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstd-jni" }

# Gradle
blossom-plugin = { module = "net.kyori.blossom:net.kyori.blossom.gradle.plugin", version.ref = "blossom" }
ideaExt-plugin = { module = "org.jetbrains.gradle.plugin.idea-ext:org.jetbrains.gradle.plugin.idea-ext.gradle.plugin", version.ref = "ideaExt" }
publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "publish" }
shadow-plugin = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
